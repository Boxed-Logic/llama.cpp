name: Windows Vulkan Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

jobs:
  windows_cpu_x64:
    name: Windows CPU x64 Build
    runs-on: windows-2025

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: windows-latest-cmake-cpu-x64
          variant: ccache
          evict-old-files: 1d

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_OPENMP=ON ^
            -DLLAMA_CURL=OFF ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release

      - name: Prepare CPU artifacts
        run: |
          New-Item -ItemType Directory -Force -Path .\cpu-artifacts
          Copy-Item "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\14.44.35112\debug_nonredist\x64\Microsoft.VC143.OpenMP.LLVM\libomp140.x86_64.dll" .\cpu-artifacts\
          Get-ChildItem -Path .\build\bin\Release\*.dll | Copy-Item -Destination .\cpu-artifacts\
          Copy-Item .\build\bin\Release\llama-server.exe .\cpu-artifacts\

      - name: Upload CPU backends artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpu-backends
          path: cpu-artifacts/
          retention-days: 1

  windows_vulkan_x64:
    name: Windows Vulkan x64 Build
    needs: [windows_cpu_x64]
    runs-on: windows-2025

    env:
      VULKAN_VERSION: 1.4.313.2

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.16
        with:
          key: windows-latest-cmake-vulkan-x64
          variant: ccache
          evict-old-files: 1d

      - name: Install Ninja
        run: choco install ninja

      - name: Install Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_VERSION }}/windows/vulkansdk-windows-X64-${{ env.VULKAN_VERSION }}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VERSION }}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${{ env.VULKAN_VERSION }}\bin"

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_VULKAN=ON
          cmake --build build --config Release --target ggml-vulkan

      - name: Download CPU backends
        uses: actions/download-artifact@v4
        with:
          name: cpu-backends
          path: ./cpu-backends

      - name: Prepare artifacts
        run: |
          New-Item -ItemType Directory -Force -Path .\release-artifacts
          Copy-Item .\build\bin\Release\ggml-vulkan.dll .\release-artifacts\
          Copy-Item .\cpu-backends\*.dll -Destination .\release-artifacts\
          Copy-Item .\cpu-backends\llama-server.exe .\release-artifacts\boxed-logic-engine.exe

      - name: Create archive
        run: |
          Compress-Archive -Path .\release-artifacts\* -DestinationPath boxed-logic-engine-windows-vulkan-x64.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            boxed-logic-engine-windows-vulkan-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: windows-vulkan-release
          path: release-artifacts/
          retention-days: 7
